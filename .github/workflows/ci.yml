name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-pion
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  PION_ALLOW_INSECURE: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
      - name: cargo check (pion)
        run: cargo check -p pion --features runtime
      - name: cargo check (pion-server)
        run: cargo check -p pion-server

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
          components: clippy
      - name: cargo clippy (pion)
        run: cargo clippy -p pion --all-targets --features runtime -- -D warnings
      - name: cargo clippy (pion-server)
        run: cargo clippy -p pion-server --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
      - name: cargo test (pion)
        run: cargo test -p pion --features runtime
      - name: cargo test (pion-server)
        run: cargo test -p pion-server
      - name: cargo test (pion-e2e IsolatedHarness)
        run: cargo test -p pion-e2e
      - name: cargo test (pion-spectra-topics)
        run: cargo test -p pion-spectra-topics

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
      - name: cargo doc (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc -p pion --features runtime --no-deps
          cargo doc -p pion-spectra-topics --no-deps
      - name: cargo test --doc
        run: cargo test -p pion --doc --features runtime

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Coverage floor (≥50% lines). Ratchet toward 90%; fail PRs that regress.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov
      - name: Line coverage floor (≥50%)
        run: cargo llvm-cov -p pion --features runtime --fail-under-lines 50 --summary-only

  # Smoke: compile pion-bench (system benches stay manual/release; see pion-bench/PERFORMANCE.md).
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin); toolchain via input
        with:
          toolchain: stable
      - name: cargo check pion-bench
        run: cargo check -p pion-bench
