[package]
name = "pion-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared matrix/scenario/bootstrap for pion-e2e and pion-bench"
publish = false

[dependencies]
pion = { path = "../pion", features = ["runtime"] }
parton = { workspace = true }
valence = { workspace = true }
spectra-core = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
axum = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
serial_test = "3"

[features]
default = []
db-hybrid = ["pion/db-hybrid"]

# Test harness: same workspace lint intent; allow unwrap/expect in fixtures.
[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
todo = "deny"
unimplemented = "deny"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
items_after_statements = "allow"
significant_drop_tightening = "allow"
used_underscore_binding = "allow"
module_name_repetitions = "allow"
cognitive_complexity = "allow"
